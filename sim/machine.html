<style>
/* V2 design: dark ink + gold, matching the 神州－四海同舟 site */
:root{color-scheme:dark;--bg:#0a1220;--panel:#111c2e;--panel2:#16233a;--line:#26364f;--line2:#33476a;--text:#e6edf7;--muted:#93a6c3;--accent:#5fd4c0;--accent2:#1d6f66;--gold:#e8c66f;--gold2:#a8843a;--warn:#f59e8b;--r:12px}

.cmpStatGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:10px}.cmpGroup{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#0b1524}.cmpGroup h4{margin:0 0 6px;font-size:13px;color:#9fc6e8;letter-spacing:.1em}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:460px;overflow:auto;margin-top:10px;padding:4px}

<script>
if(window.top!==window)document.documentElement.classList.add('embedded');
(function(){
  // Same rules as js/core/language.js; the choice is shared through localStorage 'szo.language'.
  let toSimple=null,loading=null,mode='tw';
  const read=()=>{try{return localStorage.getItem('szo.language')==='cn'?'cn':'tw'}catch(e){return 'tw'}};
  function load(){if(toSimple)return Promise.resolve();if(!loading)loading=new Promise((ok,bad)=>{const s=document.createElement('script');s.src='../js/vendor/opencc/opencc-1.4.2.js';s.onload=()=>{toSimple=OpenCC.Converter({from:'tw',to:'cn'});ok()};s.onerror=()=>{loading=null;bad()};document.head.appendChild(s)});return loading}
  const saved=new WeakMap(),skip='script,style,textarea,[translate="no"]';
  function convert(node,key,current,write){let r=saved.get(node);if(!r){r={};saved.set(node,r)}let e=r[key];if(!e||current!==e.output)e=r[key]={original:current,output:current};const out=mode==='cn'&&toSimple?toSimple(e.original):e.original;if(out!==current)write(out);e.output=out}
  function visit(node){if(node.nodeType===3){if(node.parentElement&&!node.parentElement.closest(skip))convert(node,'text',node.nodeValue,v=>{node.nodeValue=v});return}
    if(node.nodeType!==1||node.matches(skip))return;if(node.tagName==='OPTION'&&!node.hasAttribute('value'))node.setAttribute('value',node.value);
    for(const a of ['placeholder','title','aria-label'])if(node.hasAttribute(a))convert(node,a,node.getAttribute(a),v=>node.setAttribute(a,v));for(const c of node.childNodes)visit(c)}
