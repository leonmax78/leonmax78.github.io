<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四海同舟｜欄位與翻譯確認表</title><link rel="stylesheet" href="item-fields.css"></head>
<body>
<header><img src="../assets/test-media/item-icons/i5455.png" alt=""><div><h1>四海同舟｜欄位與翻譯確認表</h1><p>規劃草稿 · 不會直接變更正式站</p></div><a href="../">返回網站</a></header>
<main>
 <div class="toolbar"><input id="search" type="search" placeholder="搜尋原始欄位或中文名稱" aria-label="搜尋欄位"><select id="filter" aria-label="顯示篩選"><option value="all">全部欄位</option><option value="on">勾選顯示</option><option value="off">勾選隱藏</option><option value="changed">已修改</option></select><button id="reset" type="button">還原目前網站設定</button><button id="export" type="button">匯出確認清單</button><button id="copy" type="button">複製變更摘要</button></div>
 <div class="summary"><strong id="count">載入中</strong><span id="save" role="status" aria-live="polite"></span></div>
 <nav aria-label="對照範圍"><button id="itemTab" aria-pressed="true">ITEM 欄位</button><button id="sharedTab" aria-pressed="false">全站共用譯名</button></nav>
 <div id="error" role="alert"></div>
 <section id="items"><div class="tableWrap"><table><thead><tr><th>顯示</th><th>原始欄位</th><th>統一中文名稱</th><th>有值道具數</th><th>實際原值</th></tr></thead><tbody id="rows"></tbody></table></div></section>
 <section id="shared" hidden><div class="tableWrap"><table><thead><tr><th>原始欄位／計算鍵</th><th>統一中文名稱</th><th>共用別名</th></tr></thead><tbody id="sharedRows"></tbody></table></div></section>
</main>
<dialog id="valuesDialog" aria-labelledby="valuesTitle"><div class="dialogHead"><div><h2 id="valuesTitle"></h2><p id="valuesNote"></p></div><button id="closeValues" type="button">關閉</button></div><div class="toolbar"><input id="valueSearch" type="search" placeholder="搜尋原值、譯名或範例道具" aria-label="搜尋原值"><select id="valueMode" aria-label="原值模式"><option value="values">完整原值</option><option value="tokens">拆分代碼</option></select></div><div class="tableWrap"><table><thead><tr><th>原始值／出現筆數</th><th>目前譯法</th><th>確認後中文／註解</th><th>範例</th></tr></thead><tbody id="valueRows"></tbody></table></div><footer><button id="prev" type="button">上一頁</button><span id="pageCount"></span><button id="next" type="button">下一頁</button></footer></dialog>
<script src="../js/data/display-dictionary.js?v=570"></script><script src="../js/data/type-maps.js?v=570"></script><script src="item-fields.js?v=570"></script>
</body></html>
