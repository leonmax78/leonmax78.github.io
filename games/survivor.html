<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>神州倖存者（試玩）</title>
<meta name="robots" content="noindex">
<style>
:root{--gold:#dda84d;--gold2:#ffe7a3;--teal:#53ded3;--bg:#070d16;--panel:rgba(10,18,28,.94);--line:#2f4b5a;--text:#e6eef8;--muted:#9fb1c4;--red:#f0605a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100vw;height:100vh;height:100dvh}
.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;pointer-events:none;display:grid;gap:6px}
.xp{height:10px;border-radius:6px;background:rgba(0,0,0,.55);border:1px solid #3c5566;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2a8e80,#53ded3)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800;text-shadow:0 2px 4px #000}
.row .time{font-size:22px;color:var(--gold2);letter-spacing:.05em}
.row small{font-size:13px;color:var(--muted)}
.slots{display:flex;gap:4px;flex-wrap:wrap}
.slots span{position:relative;width:28px;height:28px;border-radius:6px;border:1px solid #6b5a33;background:#000 center/cover}
.slots span b{position:absolute;right:-2px;bottom:-4px;font-size:10px;color:#fff;text-shadow:0 0 3px #000}
.row{flex-wrap:nowrap;white-space:nowrap}.row>span:first-child{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pause{pointer-events:auto;font:inherit;font-size:13px;font-weight:800;color:var(--text);background:rgba(10,18,28,.8);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,7,12,.72);backdrop-filter:blur(3px);overflow:auto}
.screen.on{display:flex}
.box{width:min(720px,100%);max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
.box h1{margin:0 0 4px;font-size:28px;color:var(--gold2);letter-spacing:.08em}
.box h2{margin:16px 0 8px;font-size:16px;color:var(--gold)}
.box p{margin:4px 0;color:var(--muted);line-height:1.55}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.pick button,.choice button,.btn{font:inherit;color:var(--text);background:#102a36;border:1px solid #357b83;border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.pick button[aria-pressed=true]{background:#0f4f4a;border-color:var(--teal);box-shadow:0 0 0 1px var(--teal) inset}
.pick button img,.choice img{width:36px;height:36px;border-radius:6px;image-rendering:pixelated;float:left;margin-right:8px;border:1px solid #6b5a33}
.pick b,.choice b{display:block;color:var(--gold2)}
.pick small,.choice small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.btn.go{display:block;width:100%;margin-top:16px;text-align:center;font-size:20px;font-weight:900;background:linear-gradient(180deg,#e2b45c,#b9822a);color:#1b1406;border-color:#ffe7a3}
.choice{display:grid;gap:8px}
.choice button{display:flex;gap:10px;align-items:center}
.choice button:hover,.pick button:hover{border-color:var(--teal)}
.choice em{font-style:normal;font-size:12px;color:var(--teal);margin-left:6px}
.choice button.pili{border-color:#c98bff;background:linear-gradient(90deg,#2a1840,#102a36)}.choice button.pili em{color:#e3b8ff}
.pick small.piliN{color:#d6a8ff}
.slots span.pili{border-color:#c98bff}
.pick.sex{grid-template-columns:repeat(2,1fr)}
.pick canvas{width:auto;height:84px;float:left;margin-right:8px;image-rendering:pixelated}
.pick.sex button{display:flex;align-items:center;gap:6px}.pick.sex canvas{float:none;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:#0c1a24;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--gold2)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.boss{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 124px);transform:translateX(-50%);width:min(420px,80vw);pointer-events:none;display:none;text-align:center;font-weight:800;color:#ffb3a8;text-shadow:0 2px 4px #000}
.boss i{display:block;height:8px;margin-top:3px;border-radius:4px;background:rgba(0,0,0,.6);overflow:hidden;border:1px solid #6d2c26}
.boss i u{display:block;height:100%;background:linear-gradient(90deg,#c83a32,#f0605a)}
.toast{position:fixed;left:50%;top:32%;transform:translate(-50%,-50%);white-space:nowrap;font-size:clamp(18px,5.5vw,28px);font-weight:900;color:var(--gold2);text-shadow:0 3px 8px #000;pointer-events:none;opacity:0;transition:opacity .4s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud" hidden>
  <div class="xp"><i id="xpBar"></i></div>
  <div class="row"><span>Lv <b id="lv">1</b> <small id="jobName"></small></span><span class="time" id="time">00:00</span><span><small>擊倒</small> <b id="kills">0</b> <button class="pause" id="muteBtn" type="button">音效</button> <button class="pause" id="pauseBtn" type="button">暫停</button></span></div>
  <div class="slots" id="slots"></div>
</div>
<div class="boss" id="bossBar"><span id="bossName"></span><i><u id="bossHp"></u></i></div>
<div class="toast" id="toast"></div>

<div class="screen on" id="title"><div class="box">
  <h1>神州倖存者</h1>
  <p>撐過 10 分鐘的妖魔圍攻。角色會自動施放技能，你只要移動閃躲；擊倒怪物撿起經驗，升級時三選一強化。</p>
  <h2>選擇職業</h2><div class="pick" id="jobPick"></div>
  <h2>性別（一轉外觀）</h2><div class="pick sex" id="sexPick"></div>
  <h2>選擇地圖（霹靂聯動）</h2><div class="pick" id="mapPick"></div>
  <button class="btn go" id="startBtn" type="button">出戰</button>
  <p class="note">升到 3 級後，升級選項有機會出現紫色的「霹靂聯動」技能，只會出現該職業能學的。技能欄最多 6 個。</p>
  <p class="note">角色、地圖、技能特效、音樂與音效皆取自遊戲原始素材；地圖為 1:1 原尺寸。</p>
  <p class="note">電腦：WASD 或方向鍵移動，空白鍵暫停。手機：在畫面任一處按住拖曳移動。試玩版，數值仍在調整。</p>
</div></div>
<div class="screen" id="levelUp"><div class="box"><h1>升級！</h1><p>選一項強化</p><div class="choice" id="choices"></div></div></div>
<div class="screen" id="paused"><div class="box"><h1>暫停</h1><div id="pauseInfo"></div><button class="btn go" id="resumeBtn" type="button">繼續</button><button class="btn" id="quitBtn" type="button" style="width:100%;margin-top:8px;text-align:center">放棄，回到標題</button></div></div>
<div class="screen" id="over"><div class="box"><h1 id="overTitle"></h1><p id="overText"></p><div class="stats" id="overStats"></div><button class="btn go" id="againBtn" type="button">再玩一次</button><button class="btn" id="titleBtn" type="button" style="width:100%;margin-top:8px;text-align:center">回到標題</button></div></div>

<script src="survivor-data.js"></script>
<script>
'use strict';
const D = window.SURVIVOR_DATA;
const A = '../assets/';
const ICON = id => A + 'test-media/skill-icons/' + id + '.png';
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- images ----------
const imgCache = new Map();
function img(src){ let im = imgCache.get(src); if(!im){ im = new Image(); im.src = src; imgCache.set(src, im); } return im; }
const ready = im => im && im.complete && im.naturalWidth > 0;

// ---------- 遊戲素材：一轉角色、技能特效、音效（由 tools/survivor 從遊戲檔案轉出） ----------
const SV = 'sv/';
let CHAR = null, FX = null, SND = null;
const loaded = Promise.all(['char.json','fx.json','snd.json'].map(f => fetch(SV + f).then(r => r.json()))).then(([c, f, s]) => { CHAR = c; FX = f; SND = s; });
const CHAR_DIR = {劍俠:['p1','p6'], 術者:['p2','p7'], 僧侶:['p3','p8'], 勇士:['p4','p9'], 道人:['p5','pa']};
// 實心的特效照原樣畫；其餘是發光特效，用加亮混色
const FX_SOLID = new Set(['天地根','大梵聖掌','玄冰術','地裂波','怒火燒盡九重天','君子風','毒煙術']);
const FX_ROT = new Set(['劍以創生','雷箭術']);
function fxOf(name){ const m = FX && FX[name]; if(!m) return null; if(!m.img) m.img = img(SV + 'fx/' + m.f); return ready(m.img) ? m : null; }
function fxDir(m, ang){ const D = m.a[0].length; return ((Math.round((-ang) / (Math.PI * 2 / D)) % D) + D) % D; }  // 特效方向：1=東，逆時針
function fxFrame(m, t, ang){ if(m.m === 'dir'){ const row = m.a[Math.floor(t) % m.a.length]; return row[fxDir(m, ang || 0)]; } return m.a[Math.floor(t) % m.a.length]; }
function fxDraw(name, m, i, x, y, o = {}){
  const r = m.r[i]; if(!r) return;
  ctx.save(); ctx.translate(x, y); if(o.rot) ctx.rotate(o.rot); const sc = o.scale || 1; ctx.scale(sc, sc);
  ctx.globalAlpha = o.alpha == null ? 1 : o.alpha; ctx.globalCompositeOperation = FX_SOLID.has(name) ? 'source-over' : 'lighter';
  if(o.center) ctx.drawImage(m.img, r[0], r[1], r[2], r[3], -r[2] / 2, -r[3] / 2, r[2], r[3]);
  else ctx.drawImage(m.img, r[0], r[1], r[2], r[3], -r[4], -r[5], r[2], r[3]);
  ctx.restore();
}
function fxSize(m){ if(!m.sz){ let w = 1; for(const r of m.r) w = Math.max(w, r[2]); m.sz = w; } return m.sz; }
// 音效
let muted = false; try{ muted = localStorage.getItem('szo-survivor-mute') === '1'; }catch(e){}
const AU = {}, bgm = new Audio(); bgm.loop = true; bgm.volume = 0.32; bgm.preload = 'none';
function sfx(name, vol = 0.3, gap = 240){
  if(muted || !SND || !SND[name]) return; const now = performance.now(), a = AU[name] || (AU[name] = {t:0, pool:[]});
  if(now - a.t < gap) return; a.t = now;
  let el = a.pool.find(x => x.paused || x.ended); if(!el){ if(a.pool.length >= 2) return; el = new Audio(SV + 'snd/' + SND[name]); a.pool.push(el); }
  el.volume = vol; try{ el.currentTime = 0; }catch(e){} el.play().catch(() => {});
}
// 三張霹靂地圖各配一首霹靂音樂：琉璃仙境 PILI01、聖靈界線 PILI02、火宅佛獄 PILI03
function music(on){ if(on && !muted){ const want = SV + 'snd/pili' + (mapSel + 1) + '.mp3'; if(bgm.dataset.src !== want){ bgm.dataset.src = want; bgm.src = want; } bgm.play().catch(() => {}); } else bgm.pause(); }

// ---------- weapons: 技能名稱與圖示取自遊戲技能資料 ----------

};
// 霹靂布袋戲聯動技能：可學職業依遊戲技能資料（skills.json 的 cl 欄位）
const PILI = {
  天問三誓:{ic:'m0239',kind:'rain',dmg:40,cd:2.2,area:70,n:2,cl:['劍俠','勇士','道人'],desc:'救世劍訣掃蕩目標周圍'},
  怒火燒盡九重天:{ic:'m0240',kind:'rain',dmg:55,cd:3.2,area:115,n:1,cl:['劍俠','勇士','術者','道人','僧侶'],desc:'烈陽般的怒火焚燒大範圍'},
  蒼龍一吼破雲關:{ic:'m0241',kind:'wave',dmg:38,cd:2.0,area:34,cl:['劍俠','勇士','術者','道人','僧侶'],desc:'蒼藍龍氣直線貫穿'},
  天地根:{ic:'m0242',kind:'ring',dmg:42,cd:3.2,area:170,cl:['勇士','術者','道人'],desc:'三教秘招，震盪自身周圍'},

for(const [n, v] of Object.entries(PILI)) W[n] = {...v, pili:true};

];

  鐵布衫:{ic:'m0074',desc:'生命上限 +20%'},
  疾行術:{ic:'m0061',desc:'移動速度 +10%'},
  凝神訣:{ic:'m0073',desc:'技能冷卻 -8%'},

};
const MAXLV = 5;

// ---------- canvas ----------
const cv = $('c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize(){ DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight; cv.width = VW * DPR; cv.height = VH * DPR; }
addEventListener('resize', resize); resize();

// ---------- input ----------
const keys = new Set();
addEventListener('keydown', e => { keys.add(e.key.toLowerCase()); if(e.key === ' ' || e.key === 'Escape'){ if(G && G.state === 'play') pause(); else if(G && G.state === 'pause') resume(); e.preventDefault(); } });
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
const stick = {on:false, id:null, x0:0, y0:0, x:0, y:0};
cv.addEventListener('pointerdown', e => { if(stick.on) return; stick.on = true; stick.id = e.pointerId; stick.x0 = stick.x = e.clientX; stick.y0 = stick.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointermove', e => { if(stick.on && e.pointerId === stick.id){ stick.x = e.clientX; stick.y = e.clientY; } });
const endStick = e => { if(e.pointerId === stick.id){ stick.on = false; stick.id = null; } };
cv.addEventListener('pointerup', endStick); cv.addEventListener('pointercancel', endStick);
function moveDir(){
  let x = 0, y = 0;
  if(keys.has('a') || keys.has('arrowleft')) x--; if(keys.has('d') || keys.has('arrowright')) x++;
  if(keys.has('w') || keys.has('arrowup')) y--; if(keys.has('s') || keys.has('arrowdown')) y++;
  if(stick.on){ const dx = stick.x - stick.x0, dy = stick.y - stick.y0, d = Math.hypot(dx, dy); if(d > 6){ const m = Math.min(1, d / 50); x = dx / d * m; y = dy / d * m; } }
  const d = Math.hypot(x, y); return d > 1 ? [x / d, y / d] : [x, y];
}

// ---------- game state ----------
let G = null, jobSel = 0, mapSel = 0, sexSel = 0;
const WW = 4096, WH = 3072, TILE = 512, WIN_TIME = 600, BOSS_EVERY = 150;

function newGame(){
  const job = JOBS[jobSel], map = D.maps[mapSel];
  const folder = CHAR_DIR[job.id][sexSel];
  G = {
    state:'play', t:0, kills:0, job, map, mapDir:SV + 'map/' + map[0] + '/', ww:WW, wh:WH, tierBase:map[3],
    char:CHAR[folder], charImg:img(SV + 'char_' + folder + '.webp'), moving:false,
    p:{x:WW / 2, y:WH / 2, r:14, hp:job.hp, max:job.hp, spd:job.spd, armor:job.armor, regen:job.regen || 0, magnet:90, dmg:1, cd:1, area:1, inv:0, face:[1,0], lv:1, xp:0, need:5},
    weapons:[], passives:{}, enemies:[], shots:[], fx:[], orbs:[], nums:[], clouds:[], spawnT:0, nextBoss:BOSS_EVERY, boss:null, levelQueue:0
  };
  addWeapon(job.start);
  $('jobName').textContent = job.id + '・' + map[1]; music(true);
  ['title','over','paused','levelUp'].forEach(s => $(s).classList.remove('on'));
  $('hud').hidden = false; refreshSlots(); toast(map[1] + '　開戰');
}
function addWeapon(name){ G.weapons.push({name, ...W[name], lv:1, t:0, ang:0, hit:new Map()}); fxOf(name); }
function weaponStat(w){
  const lv = w.lv, p = G.p;
  return {
    dmg:w.dmg * (1 + 0.25 * (lv - 1)) * p.dmg,
    cd:Math.max(0.12, (w.cd || 0) * Math.pow(0.9, lv - 1) * p.cd),
    area:(w.area || 0) * (1 + 0.1 * (lv - 1)) * p.area,
    n:(w.n || 1) + Math.floor((lv - 1) / 2) + (w.kind === 'burst' ? (lv - 1) * 2 : 0)
  };
}

// ---------- enemies ----------
function tierNow(){ return clamp(G.tierBase + Math.floor(G.t / 120), 0, 5); }
function spawnEnemy(boss){
  const p = G.p, ang = rnd(0, Math.PI * 2), dist = Math.hypot(VW, VH) / 2 + 60;
  const x = clamp(p.x + Math.cos(ang) * dist, 10, G.ww - 10), y = clamp(p.y + Math.sin(ang) * dist, 10, G.wh - 10);
  const minutes = G.t / 60, hard = 1 + G.tierBase * 0.35;
  if(boss){
    const b = D.boss[Math.min(D.boss.length - 1, Math.floor(G.t / BOSS_EVERY) * 2 + G.tierBase * 2 + Math.floor(Math.random() * 2))];
    const hp = (700 + minutes * 450) * hard;
    const e = {x, y, r:42, hp, max:hp, spd:42, dmg:14 * hard, src:A + b[0].replace(/^assets\//, ''), name:b[1].replace(/[\[\]{}]/g, ''), boss:true, xp:60, hitT:0, slow:0, h:110, sc:1.3};
    G.enemies.push(e); G.boss = e; toast('封獸出現：' + e.name); sfx('_boss', 0.5);
    return;
  }
  const tier = Math.random() < 0.25 && tierNow() > 0 ? tierNow() - 1 : tierNow();
  const m = pickOne(D.tiers[tier]);
  const hp = (8 + minutes * 8) * (1 + tier * 0.45) * hard;
  G.enemies.push({x, y, r:15 + tier, hp, max:hp, spd:rnd(40, 58) + tier * 2 + minutes * 1.5, dmg:(4 + tier * 1.5 + minutes * 0.7) * hard, src:A + 'test-media/monster-portraits/m' + m[0] + '.png', name:m[1], xp:1 + tier, hitT:0, slow:0, h:46 + tier * 3, sc:1});
}
function hurt(e, dmg, kx, ky){
  if(e.dead) return;
  e.hp -= dmg; e.hitT = 0.12;
  if(!e.boss && (kx || ky)){ e.x += kx; e.y += ky; }
  G.nums.push({x:e.x + rnd(-8, 8), y:e.y - e.h * 0.6, v:Math.round(dmg), t:0.7});
  if(e.hp <= 0){
    e.dead = true; G.kills++; sfx('_death', 0.16, 320);
    G.orbs.push({x:e.x, y:e.y, v:e.xp, big:e.boss});
    if(e.boss){ G.boss = null; for(let i = 0; i < 2; i++) G.levelQueue++; G.orbs.push({x:e.x + 20, y:e.y, heal:true}); }
    else if(Math.random() < 0.012) G.orbs.push({x:e.x, y:e.y, heal:true});
  }
}

// ---------- weapons fire ----------
function nearest(x, y, n, maxD = 900){
  return G.enemies.filter(e => !e.dead).map(e => [e, Math.hypot(e.x - x, e.y - y)]).filter(a => a[1] < maxD).sort((a, b) => a[1] - b[1]).slice(0, n).map(a => a[0]);
}
function fire(w, dt){
  const p = G.p, s = weaponStat(w);
  if(w.kind === 'orbit'){
    w.ang += dt * (2.4 + w.lv * 0.25); w.st = (w.st || 0) - dt; if(w.st <= 0){ w.st = 2.4; sfx(w.name, 0.18); }
    for(let i = 0; i < s.n; i++){
      const a = w.ang + i * Math.PI * 2 / s.n, ox = p.x + Math.cos(a) * s.area, oy = p.y + Math.sin(a) * s.area;
      for(const e of G.enemies){ if(e.dead) continue; if(Math.hypot(e.x - ox, e.y - oy) < e.r + 16){ const last = w.hit.get(e) || 0; if(G.t - last > 0.45){ w.hit.set(e, G.t); hurt(e, s.dmg, Math.cos(a) * 6, Math.sin(a) * 6); } } }
    }
    return;
  }
  if(w.kind === 'aura'){
    w.t -= dt; if(w.t > 0) return; w.t = s.cd; w.st = (w.st || 0) - s.cd; if(w.st <= 0){ w.st = 3; sfx(w.name, 0.18); }
    for(const e of G.enemies) if(!e.dead && Math.hypot(e.x - p.x, e.y - p.y) < s.area + e.r) hurt(e, s.dmg, 0, 0);
    return;
  }
  w.t -= dt; if(w.t > 0) return;
  const targets = nearest(p.x, p.y, Math.max(1, s.n), w.kind === 'rain' ? Math.max(VW, VH) * 0.6 : 900);
  if(!targets.length && !['arc','ring','burst','wave'].includes(w.kind)) return;
  w.t = s.cd; sfx(w.name, w.pili ? 0.4 : 0.3);
  const aim = targets[0] ? Math.atan2(targets[0].y - p.y, targets[0].x - p.x) : Math.atan2(p.face[1], p.face[0]);
  switch(w.kind){
    case 'arc': {
      const a0 = targets[0] && Math.hypot(targets[0].x - p.x, targets[0].y - p.y) < s.area + 60 ? aim : Math.atan2(p.face[1], p.face[0]);
      for(const e of G.enemies){ if(e.dead) continue; const d = Math.hypot(e.x - p.x, e.y - p.y); if(d > s.area + e.r) continue; let da = Math.abs(((Math.atan2(e.y - p.y, e.x - p.x) - a0 + Math.PI * 3) % (Math.PI * 2)) - Math.PI); if(da < Math.PI / 2 + 0.2) hurt(e, s.dmg, (e.x - p.x) / d * 14, (e.y - p.y) / d * 14); }
      G.fx.push({kind:'arc', x:p.x, y:p.y, a:a0, r:s.area, t:0.36, T:0.36, ic:w.ic, name:w.name}); break;
    }
    case 'ring': G.fx.push({kind:'ring', x:p.x, y:p.y, r:0, R:s.area, t:0.6, T:0.6, dmg:s.dmg, hit:new Set(), ic:w.ic, name:w.name}); break;
    case 'homing': for(let i = 0; i < s.n; i++){ const tg = targets[i % targets.length]; G.shots.push({kind:'homing', x:p.x, y:p.y, vx:Math.cos(aim) * 380, vy:Math.sin(aim) * 380, tg, dmg:s.dmg, life:2.2, r:9, pierce:1 + Math.floor(w.lv / 3), ic:w.ic, name:w.name, hit:new Set()}); } break;
    case 'wave': { const a = Math.hypot(p.face[0], p.face[1]) ? Math.atan2(p.face[1], p.face[0]) : aim; G.shots.push({kind:'wave', x:p.x, y:p.y, vx:Math.cos(a) * 460, vy:Math.sin(a) * 460, dmg:s.dmg, life:1.1, r:s.area, pierce:99, ic:w.ic, name:w.name, hit:new Set()}); if(w.lv >= 4) G.shots.push({kind:'wave', x:p.x, y:p.y, vx:-Math.cos(a) * 460, vy:-Math.sin(a) * 460, dmg:s.dmg, life:1.1, r:s.area, pierce:99, ic:w.ic, name:w.name, hit:new Set()}); break; }
    case 'rain': for(let i = 0; i < s.n; i++){ const tg = targets[i % targets.length] || {x:p.x + rnd(-200, 200), y:p.y + rnd(-200, 200)}; G.fx.push({kind:'warn', x:tg.x + rnd(-10, 10), y:tg.y + rnd(-10, 10), r:s.area, t:0.45, T:0.45, dmg:s.dmg, ic:w.ic, name:w.name}); } break;
    case 'darts': targets.forEach((tg, i) => { const a = Math.atan2(tg.y - p.y, tg.x - p.x) + (i ? rnd(-0.05, 0.05) : 0); G.shots.push({kind:'dart', x:p.x, y:p.y, vx:Math.cos(a) * 560, vy:Math.sin(a) * 560, dmg:s.dmg, life:1, r:6, pierce:1 + Math.floor(w.lv / 4), ic:w.ic, name:w.name, hit:new Set()}); }); break;
    case 'burst': for(let i = 0; i < s.n; i++){ const a = i * Math.PI * 2 / s.n + rnd(0, 0.3); G.shots.push({kind:'dart', x:p.x, y:p.y, vx:Math.cos(a) * 420, vy:Math.sin(a) * 420, dmg:s.dmg, life:0.9, r:6, pierce:2, ic:w.ic, name:w.name, hit:new Set()}); } break;
    case 'cloud': { const tg = targets[0]; G.clouds.push({x:tg.x, y:tg.y, r:s.area, t:3 + w.lv * 0.4, tick:0, dmg:s.dmg, ic:w.ic, name:w.name}); if(w.lv >= 3 && targets[1]) G.clouds.push({x:targets[1].x, y:targets[1].y, r:s.area, t:3, tick:0, dmg:s.dmg, ic:w.ic, name:w.name}); break; }
    case 'boomer': for(let i = 0; i < s.n; i++){ const a = aim + (i - (s.n - 1) / 2) * 0.5; G.shots.push({kind:'boomer', x:p.x, y:p.y, vx:Math.cos(a) * 420, vy:Math.sin(a) * 420, dmg:s.dmg, life:2.4, age:0, r:14, pierce:99, ic:w.ic, name:w.name, hit:new Map()}); } break;
    case 'ice': for(let i = 0; i < s.n; i++){ const tg = targets[i % targets.length]; const a = Math.atan2(tg.y - p.y, tg.x - p.x); G.shots.push({kind:'ice', x:p.x, y:p.y, vx:Math.cos(a) * 420, vy:Math.sin(a) * 420, dmg:s.dmg, life:1.4, r:9, pierce:1 + Math.floor(w.lv / 3), ic:w.ic, name:w.name, hit:new Set()}); } break;
  }
}

// ---------- level up ----------
function options(){
  const out = [];
  for(const w of G.weapons) if(w.lv < MAXLV) out.push({type:'wup', name:w.name, ic:w.ic, text:W[w.name].desc, lv:w.lv + 1});
  const room = G.weapons.length < MAX_WEAPONS;
  if(room) for(const n of G.job.pool) if(!G.weapons.some(w => w.name === n)) out.push({type:'wnew', name:n, ic:W[n].ic, text:W[n].desc, lv:1});
  // 霹靂聯動技能：只出現本職業可學的，每次升級最多抽一個
  const pili = room ? Object.keys(PILI).filter(n => PILI[n].cl.includes(G.job.id) && !G.weapons.some(w => w.name === n)) : [];
  if(pili.length && G.p.lv >= 3 && Math.random() < 0.45){ const n = pickOne(pili); out.push({type:'wnew', name:n, ic:W[n].ic, text:W[n].desc, lv:1, pili:true}); }
  for(const [n, v] of Object.entries(P)) if((G.passives[n] || 0) < MAXLV) out.push({type:'pas', name:n, ic:v.ic, text:v.desc, lv:(G.passives[n] || 0) + 1});
  for(let i = out.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [out[i], out[j]] = [out[j], out[i]]; }
  // 新技能優先出現一個
  const pickNew = out.findIndex(o => o.type === 'wnew'); if(pickNew > 2 && Math.random() < 0.6) [out[0], out[pickNew]] = [out[pickNew], out[0]];
  const piliPick = out.findIndex(o => o.pili); if(piliPick > 2) [out[1], out[piliPick]] = [out[piliPick], out[1]];
  const list = out.slice(0, 3);
  if(!list.length) list.push({type:'heal', name:'療傷', ic:'m0029', text:'回復 40% 生命', lv:0});
  return list;
}
function showLevelUp(){
  G.state = 'level'; sfx('_level', 0.45); const box = $('choices'); box.replaceChildren();
  for(const o of options()){
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<img src="${ICON(o.ic)}" alt=""><span><b>${o.name}${o.lv ? `<em>${o.pili ? '霹靂聯動' : o.type === 'wnew' ? '新技能' : 'Lv ' + o.lv}</em>` : ''}</b><small>${o.text}${o.type === 'wup' ? '：傷害、冷卻、數量提升' : ''}</small></span>`;
    if(o.pili) b.classList.add('pili');
    b.onclick = () => { apply(o); $('levelUp').classList.remove('on'); G.levelQueue--; if(G.levelQueue > 0) showLevelUp(); else { G.state = 'play'; last = performance.now(); } };
    box.appendChild(b);
  }
  $('levelUp').classList.add('on');
}
function apply(o){
  const p = G.p;
  if(o.type === 'wup') G.weapons.find(w => w.name === o.name).lv++;
  else if(o.type === 'wnew') addWeapon(o.name);
  else if(o.type === 'heal') p.hp = Math.min(p.max, p.hp + p.max * 0.4);
  else {
    G.passives[o.name] = (G.passives[o.name] || 0) + 1;
    ({鐵布衫:() => { p.max *= 1.2; p.hp += p.max * 0.2 / 1.2; }, 疾行術:() => p.spd *= 1.1, 凝神訣:() => p.cd *= 0.92, 集氣心法:() => p.dmg *= 1.12, 加速回血:() => p.regen += 0.6, 照妖術:() => p.magnet *= 1.35, 金鐘罩:() => p.armor += 1, 騰雲術:() => p.area *= 1.12})[o.name]();
  }
  refreshSlots();
}
function refreshSlots(){
  const s = $('slots'); s.replaceChildren();
  for(const w of G.weapons){ const e = document.createElement('span'); if(w.pili) e.classList.add('pili'); e.style.backgroundImage = `url(${ICON(w.ic)})`; e.title = w.name; e.innerHTML = `<b>${w.lv}</b>`; s.appendChild(e); }
  for(const [n, lv] of Object.entries(G.passives)){ const e = document.createElement('span'); e.style.backgroundImage = `url(${ICON(P[n].ic)})`; e.style.borderColor = '#357b83'; e.title = n; e.innerHTML = `<b>${lv}</b>`; s.appendChild(e); }
}

// ---------- update ----------
function update(dt){
  const p = G.p;
  G.t += dt;
  // move
  const [mx, my] = moveDir();
  G.moving = !!(mx || my); if(G.moving){ p.face = [mx, my]; }
  p.x = clamp(p.x + mx * p.spd * dt, p.r, G.ww - p.r); p.y = clamp(p.y + my * p.spd * dt, p.r, G.wh - p.r);
  p.inv = Math.max(0, p.inv - dt); p.hp = Math.min(p.max, p.hp + p.regen * dt);
  // spawn
  const rate = 0.9 + G.t / 40 + G.tierBase * 0.4;
  G.spawnT += dt * rate;
  const cap = 140 + Math.floor(G.t / 3);
  while(G.spawnT >= 1){ G.spawnT -= 1; if(G.enemies.length < cap) spawnEnemy(false); }
  if(G.t >= G.nextBoss && G.nextBoss <= WIN_TIME){ spawnEnemy(true); G.nextBoss += BOSS_EVERY; }
  // weapons
  for(const w of G.weapons) fire(w, dt);
  // enemies
  for(const e of G.enemies){
    if(e.dead) continue;
    e.hitT = Math.max(0, e.hitT - dt); e.slow = Math.max(0, e.slow - dt);
    const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1, sp = e.spd * (e.slow ? 0.45 : 1);
    e.x += dx / d * sp * dt; e.y += dy / d * sp * dt; e.dir = dx < 0 ? -1 : 1;
    if(d < e.r + p.r && p.inv <= 0){ const dmg = Math.max(1, e.dmg - p.armor); p.hp -= dmg; p.inv = 0.6; sfx('_hurt', 0.35); G.nums.push({x:p.x, y:p.y - 30, v:Math.round(dmg), t:0.7, bad:true}); }
  }
  // light separation so crowds spread out
  const es = G.enemies;
  for(let i = 0; i < es.length; i += 2){ const a = es[i], b = es[(i * 7 + 3) % es.length]; if(a === b || a.dead || b.dead) continue; const dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy), m = a.r + b.r; if(d > 0 && d < m){ const k = (m - d) / d * 0.5; a.x += dx * k; a.y += dy * k; b.x -= dx * k; b.y -= dy * k; } }
  // shots
  for(const s of G.shots){
    s.life -= dt;
    if(s.kind === 'homing' && s.tg){ if(s.tg.dead) s.tg = nearest(s.x, s.y, 1)[0]; if(s.tg){ const a = Math.atan2(s.tg.y - s.y, s.tg.x - s.x), sp = 420; s.vx += (Math.cos(a) * sp - s.vx) * Math.min(1, dt * 6); s.vy += (Math.sin(a) * sp - s.vy) * Math.min(1, dt * 6); } }
    if(s.kind === 'boomer'){ s.age += dt; if(s.age > 0.6){ const a = Math.atan2(p.y - s.y, p.x - s.x); s.vx += Math.cos(a) * 1500 * dt; s.vy += Math.sin(a) * 1500 * dt; if(s.age > 1 && Math.hypot(p.x - s.x, p.y - s.y) < 24) s.life = 0; } }
    s.x += s.vx * dt; s.y += s.vy * dt;
    for(const e of G.enemies){
      if(e.dead || s.life <= 0) continue;
      if(Math.hypot(e.x - s.x, e.y - s.y) > e.r + s.r) continue;
      if(s.kind === 'boomer'){ const last = s.hit.get(e) || -9; if(s.age - last < 0.35) continue; s.hit.set(e, s.age); hurt(e, s.dmg, s.vx * 0.012, s.vy * 0.012); continue; }
      if(s.hit.has(e)) continue; s.hit.add(e);
      hurt(e, s.dmg, s.vx * 0.015, s.vy * 0.015); if(s.kind === 'ice') e.slow = 1.6;
      if(--s.pierce <= 0) s.life = 0;
    }
  }
  G.shots = G.shots.filter(s => s.life > 0);
  // area effects
  for(const f of G.fx){
    f.t -= dt;
    if(f.kind === 'ring'){ f.r = clamp(f.R * (1 - f.t / f.T), 0, f.R); for(const e of G.enemies){ if(e.dead || f.hit.has(e)) continue; const d = Math.hypot(e.x - f.x, e.y - f.y); if(d < f.r + e.r){ f.hit.add(e); hurt(e, f.dmg, (e.x - f.x) / (d || 1) * 18, (e.y - f.y) / (d || 1) * 18); } } }
    if(f.kind === 'warn' && f.t <= 0 && !f.done){ f.done = true; for(const e of G.enemies) if(!e.dead && Math.hypot(e.x - f.x, e.y - f.y) < f.r + e.r) hurt(e, f.dmg, 0, 0); G.fx.push({kind:'boom', x:f.x, y:f.y, r:f.r, t:0.55, T:0.55, ic:f.ic, name:f.name}); }
  }
  G.fx = G.fx.filter(f => f.t > 0);
  for(const c of G.clouds){ c.t -= dt; c.tick -= dt; if(c.tick <= 0){ c.tick = 0.4; for(const e of G.enemies) if(!e.dead && Math.hypot(e.x - c.x, e.y - c.y) < c.r + e.r) hurt(e, c.dmg, 0, 0); } }
  G.clouds = G.clouds.filter(c => c.t > 0);
  G.enemies = G.enemies.filter(e => !e.dead);
  // orbs
  for(const o of G.orbs){
    const d = Math.hypot(p.x - o.x, p.y - o.y);
    if(d < p.magnet || o.pull){ o.pull = true; const sp = 380 + (300 - Math.min(300, d)); o.x += (p.x - o.x) / (d || 1) * sp * dt; o.y += (p.y - o.y) / (d || 1) * sp * dt; }
    if(d < p.r + 6){ o.got = true; if(o.heal) p.hp = Math.min(p.max, p.hp + p.max * 0.3); else { p.xp += o.v; while(p.xp >= p.need){ p.xp -= p.need; p.lv++; p.need = Math.floor(4 + p.lv * 4 + Math.pow(p.lv, 1.5)); G.levelQueue++; } } }
  }
  G.orbs = G.orbs.filter(o => !o.got);
  if(G.orbs.length > 400){ const extra = G.orbs.splice(0, G.orbs.length - 300); const sum = extra.reduce((n, o) => n + (o.v || 0), 0); G.orbs.push({x:extra[0].x, y:extra[0].y, v:sum, big:true}); }
  for(const n of G.nums) n.t -= dt; G.nums = G.nums.filter(n => n.t > 0);
  // end / level
  if(p.hp <= 0){ end(false); return; }
  if(G.t >= WIN_TIME && !G.boss){ end(true); return; }
  if(G.levelQueue > 0) showLevelUp();
}

// ---------- draw ----------
function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#05080d'; ctx.fillRect(0, 0, VW, VH);
  if(!G) return;
  const p = G.p;
  const cx = clamp(p.x - VW / 2, Math.min(0, G.ww - VW), Math.max(0, G.ww - VW)), cy = clamp(p.y - VH / 2, Math.min(0, G.wh - VH), Math.max(0, G.wh - VH));
  ctx.save(); ctx.translate(-cx, -cy);
  // 1:1 地圖：只畫鏡頭內的 512px 圖塊，還沒載完的先用縮圖墊著
  ctx.imageSmoothingEnabled = true;
  const mini = img(G.mapDir + 'mini.webp');
  for(let ty = Math.max(0, Math.floor(cy / TILE)); ty <= Math.min(WH / TILE - 1, Math.floor((cy + VH) / TILE)); ty++)
    for(let tx = Math.max(0, Math.floor(cx / TILE)); tx <= Math.min(WW / TILE - 1, Math.floor((cx + VW) / TILE)); tx++){
      const t = img(G.mapDir + tx + '_' + ty + '.webp');
      if(ready(t)) ctx.drawImage(t, tx * TILE, ty * TILE, TILE + 0.5, TILE + 0.5);
      else if(ready(mini)) ctx.drawImage(mini, tx * TILE / 16, ty * TILE / 16, TILE / 16, TILE / 16, tx * TILE, ty * TILE, TILE, TILE);
    }
  ctx.strokeStyle = 'rgba(221,168,77,.6)'; ctx.lineWidth = 3; ctx.strokeRect(0, 0, G.ww, G.wh);
  // clouds
  for(const c of G.clouds){ const m = fxOf(c.name); ctx.fillStyle = 'rgba(120,200,90,.14)'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, 7); ctx.fill(); if(m) fxDraw(c.name, m, fxFrame(m, G.t * 9), c.x, c.y, {center:true, scale:c.r * 2 / fxSize(m), alpha:Math.min(1, c.t)}); }
  // aura
  for(const w of G.weapons) if(w.kind === 'aura'){ const s = weaponStat(w), m = fxOf(w.name); const g = ctx.createRadialGradient(p.x, p.y, s.area * 0.3, p.x, p.y, s.area); g.addColorStop(0, 'rgba(255,140,40,0)'); g.addColorStop(1, 'rgba(255,110,30,.16)'); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, s.area, 0, 7); ctx.fill();
    if(m){ const n = 6; for(let i = 0; i < n; i++){ const a = G.t * 0.9 + i * Math.PI * 2 / n; fxDraw(w.name, m, fxFrame(m, G.t * 10 + i * 2), p.x + Math.cos(a) * s.area * 0.72, p.y - 20 + Math.sin(a) * s.area * 0.72, {center:w.name !== '三昧真火', scale:w.name === '三昧真火' ? 0.6 : 0.8}); } } }
  // orbs
  for(const o of G.orbs){
    if(o.heal){ ctx.fillStyle = '#f0605a'; ctx.beginPath(); ctx.arc(o.x, o.y, 8, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(o.x - 1.5, o.y - 5, 3, 10); ctx.fillRect(o.x - 5, o.y - 1.5, 10, 3); continue; }
    ctx.fillStyle = o.big ? '#ffd166' : o.v >= 4 ? '#ff7bd5' : o.v >= 2 ? '#53ded3' : '#6fb4ff';
    ctx.beginPath(); ctx.moveTo(o.x, o.y - 6); ctx.lineTo(o.x + 4.5, o.y); ctx.lineTo(o.x, o.y + 6); ctx.lineTo(o.x - 4.5, o.y); ctx.closePath(); ctx.fill();
  }
  // warnings / booms / rings / arcs
  for(const f of G.fx){
    const k = f.t / f.T;
    if(f.kind === 'warn'){ ctx.strokeStyle = 'rgba(255,230,140,' + (0.4 + 0.5 * (1 - k)) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0, f.r * (1.1 - 0.1 * k)), 0, 7); ctx.stroke(); }
    const m = fxOf(f.name), prog = 1 - k;
    if(f.kind === 'boom'){
      if(m && m.m === 'seq'){ const i = m.a[Math.min(m.a.length - 1, Math.floor(prog * m.a.length))]; fxDraw(f.name, m, i, f.x, f.y, {scale:clamp(f.r * 2 / fxSize(m), 0.7, 2.2), alpha:Math.min(1, k * 4)}); }
      else { ctx.fillStyle = 'rgba(255,220,120,' + (0.55 * k) + ')'; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill(); }
    }
    if(f.kind === 'ring'){
      ctx.strokeStyle = 'rgba(255,215,120,' + (0.5 * k) + ')'; ctx.lineWidth = Math.max(1, 4 * k + 1); ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(0, f.r || 0), 0, 7); ctx.stroke();
      if(m && m.m === 'dir'){ const D = m.a[0].length; for(let d = 0; d < D; d++){ const a = -d * Math.PI * 2 / D; fxDraw(f.name, m, m.a[0][d], f.x + Math.cos(a) * f.r * 0.8, f.y + Math.sin(a) * f.r * 0.8, {center:true, scale:1.2, alpha:Math.min(1, k * 3)}); } }
      else if(m){ const i = m.a[Math.min(m.a.length - 1, Math.floor(prog * m.a.length))]; fxDraw(f.name, m, i, f.x, f.y, {scale:clamp(f.R * 1.6 / fxSize(m), 0.8, 3), alpha:Math.min(1, k * 4)}); }
    }
    if(f.kind === 'arc'){
      ctx.fillStyle = 'rgba(200,240,255,' + (0.22 * k) + ')'; ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.arc(f.x, f.y, f.r, f.a - Math.PI / 2, f.a + Math.PI / 2); ctx.closePath(); ctx.fill();
      if(m && m.m === 'dir'){ for(let j = -2; j <= 2; j++){ const a = f.a + j * 0.42 + (prog - 0.5) * 0.5; fxDraw(f.name, m, fxFrame(m, G.t * 14, a), f.x + Math.cos(a) * f.r * (0.35 + 0.6 * prog), f.y - 30 + Math.sin(a) * f.r * (0.35 + 0.6 * prog), {center:true, scale:1.3, alpha:Math.min(1, k * 3)}); } }
      else if(m){ const i = m.a[Math.min(m.a.length - 1, Math.floor(prog * m.a.length))]; fxDraw(f.name, m, i, f.x + Math.cos(f.a) * f.r * 0.5, f.y - 30 + Math.sin(f.a) * f.r * 0.5, {center:true, scale:clamp(f.r * 1.8 / fxSize(m), 0.8, 2.4)}); }
    }
  }
  // enemies (sorted by y so lower ones overlap upper ones)
  G.enemies.sort((a, b) => a.y - b.y);
  for(const e of G.enemies){
    const im = img(e.src);
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.ellipse(e.x, e.y + 4, e.r, e.r * 0.4, 0, 0, 7); ctx.fill();
    if(ready(im)){ const h = im.naturalHeight * e.sc, w = im.naturalWidth * e.sc; e.h = h; if(!e.boss) e.r = clamp(w * 0.3, 12, 34); ctx.save(); if(e.dir < 0){ ctx.translate(e.x, 0); ctx.scale(-1, 1); ctx.translate(-e.x, 0); } if(e.hitT > 0) ctx.filter = 'brightness(2.2)'; else if(e.slow) ctx.filter = 'hue-rotate(160deg) saturate(1.6)'; ctx.drawImage(im, e.x - w / 2, e.y - h + 6, w, h); ctx.restore(); }
    else { ctx.fillStyle = '#7a3b3b'; ctx.beginPath(); ctx.arc(e.x, e.y - e.r, e.r, 0, 7); ctx.fill(); }
    if(e.boss){ ctx.strokeStyle = '#f0605a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(e.x, e.y + 4, e.r + 6, (e.r + 6) * 0.4, 0, 0, 7); ctx.stroke(); }
  }
  // orbiting blades
  for(const w of G.weapons) if(w.kind === 'orbit'){ const s = weaponStat(w), ic = img(ICON(w.ic)), m = fxOf(w.name); for(let i = 0; i < s.n; i++){ const a = w.ang + i * Math.PI * 2 / s.n, ox = p.x + Math.cos(a) * s.area, oy = p.y - 30 + Math.sin(a) * s.area;
    if(m){ fxDraw(w.name, m, fxFrame(m, G.t * 10 + i * 3, a + Math.PI / 2), ox, oy, {center:true, scale:w.name === '般若懺' ? 0.5 : 1.25}); continue; }
    ctx.save(); ctx.translate(ox, oy); ctx.rotate(a * 2); if(ready(ic)) ctx.drawImage(ic, -14, -14, 28, 28); ctx.restore(); } }
  // player
  // 玩家：一轉角色，方向 1=西、順時針共 8 向；走路 8 格、待機 7 格
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, 17, 7, 0, 0, 7); ctx.fill();
  ctx.save(); if(p.inv > 0 && Math.floor(p.inv * 20) % 2) ctx.globalAlpha = 0.5;
  if(ready(G.charImg)){
    const dir = ((Math.round((Math.atan2(p.face[1], p.face[0]) - Math.PI) / (Math.PI / 4)) % 8) + 8) % 8;
    const seq = G.char.a[G.moving ? 'walk' : 'wait'][dir], r = G.char.r[seq[Math.floor(G.t * (G.moving ? 12 : 5)) % seq.length]];
    ctx.imageSmoothingEnabled = false; ctx.drawImage(G.charImg, r[0], r[1], r[2], r[3], Math.round(p.x - r[4]), Math.round(p.y - r[5]), r[2], r[3]); ctx.imageSmoothingEnabled = true;
  } else { ctx.fillStyle = '#dda84d'; ctx.beginPath(); ctx.arc(p.x, p.y - 30, 16, 0, 7); ctx.fill(); }
  ctx.restore();
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(p.x - 22, p.y + 10, 44, 5); ctx.fillStyle = p.hp / p.max > 0.35 ? '#4fd17a' : '#f0605a'; ctx.fillRect(p.x - 22, p.y + 10, 44 * Math.max(0, p.hp / p.max), 5);
  // shots
  for(const s of G.shots){
    const ic = img(ICON(s.ic)), a = Math.atan2(s.vy, s.vx), m = fxOf(s.name);
    if(m){ const big = s.kind === 'wave' ? clamp(s.r * 3.2 / fxSize(m), 0.9, 2) : s.kind === 'dart' ? 1 : 1.15;
      fxDraw(s.name, m, fxFrame(m, G.t * 14, a), s.x, s.y - 30, {center:true, scale:m.m === 'seq' && fxSize(m) > 120 ? 0.45 : big, rot:m.m === 'seq' ? (s.kind === 'boomer' ? G.t * 10 : FX_ROT.has(s.name) ? a : 0) : 0}); continue; }
    ctx.save(); ctx.translate(s.x, s.y - 30); ctx.rotate(s.kind === 'boomer' ? G.t * 14 : a + Math.PI / 4);
    if(s.kind === 'wave'){ ctx.rotate(-Math.PI / 4); ctx.fillStyle = 'rgba(170,230,255,.55)'; ctx.beginPath(); ctx.ellipse(0, 0, s.r * 0.6, s.r, 0, 0, 7); ctx.fill(); }
    if(s.kind === 'ice'){ ctx.shadowColor = '#7fd8ff'; ctx.shadowBlur = 12; }
    const z = s.kind === 'dart' ? 18 : s.kind === 'wave' ? 26 : 24;
    if(ready(ic)) ctx.drawImage(ic, -z / 2, -z / 2, z, z);
    ctx.restore();
  }
  // numbers
  ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
  for(const n of G.nums){ ctx.globalAlpha = Math.min(1, n.t * 2); ctx.fillStyle = n.bad ? '#ff6b6b' : '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; const y = n.y - (0.7 - n.t) * 30; ctx.strokeText(n.v, n.x, y); ctx.fillText(n.v, n.x, y); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // joystick
  if(stick.on){ ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(stick.x0, stick.y0, 50, 0, 7); ctx.stroke(); const dx = stick.x - stick.x0, dy = stick.y - stick.y0, d = Math.min(50, Math.hypot(dx, dy)), a = Math.atan2(dy, dx); ctx.fillStyle = 'rgba(83,222,211,.55)'; ctx.beginPath(); ctx.arc(stick.x0 + Math.cos(a) * d, stick.y0 + Math.sin(a) * d, 20, 0, 7); ctx.fill(); }
  // edge arrow toward boss when off-screen
  if(G.boss){ const b = G.boss, sx = b.x - cx, sy = b.y - cy; if(sx < 0 || sy < 0 || sx > VW || sy > VH){ const a = Math.atan2(sy - VH / 2, sx - VW / 2), ex = VW / 2 + Math.cos(a) * (Math.min(VW, VH) / 2 - 30), ey = VH / 2 + Math.sin(a) * (Math.min(VW, VH) / 2 - 30); ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = '#f0605a'; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-8, -9); ctx.lineTo(-8, 9); ctx.closePath(); ctx.fill(); ctx.restore(); } }
}
function hud(){
  const p = G.p, m = Math.floor(G.t / 60), s = Math.floor(G.t % 60);
  $('time').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  $('lv').textContent = p.lv; $('kills').textContent = G.kills; $('xpBar').style.width = (p.xp / p.need * 100) + '%';
  const bb = $('bossBar'); if(G.boss){ bb.style.display = 'block'; $('bossName').textContent = '封獸　' + G.boss.name; $('bossHp').style.width = Math.max(0, G.boss.hp / G.boss.max * 100) + '%'; } else bb.style.display = 'none';
}
let toastT = 0;
function toast(t){ const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => el.style.opacity = 0, 1600); }

// ---------- flow ----------
let last = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if(G && G.state === 'play'){ update(dt); if(G.state === 'play' || G.state === 'level') hud(); }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function pause(){ if(!G || G.state !== 'play') return; G.state = 'pause'; $('pauseInfo').innerHTML = `<p>${G.job.id}・${G.map[1]}・Lv ${G.p.lv}</p><p>技能：${G.weapons.map(w => w.name + ' Lv' + w.lv).join('、')}</p><p>強化：${Object.entries(G.passives).map(([n, l]) => n + ' Lv' + l).join('、') || '無'}</p>`; $('paused').classList.add('on'); }
function resume(){ if(!G || G.state !== 'pause') return; $('paused').classList.remove('on'); G.state = 'play'; last = performance.now(); }
function end(win){
  G.state = 'over'; $('hud').hidden = true; $('bossBar').style.display = 'none';
  $('overTitle').textContent = win ? '撐過來了！' : '倒下了…';
  $('overText').textContent = win ? `${G.job.id}在${G.map[1]}撐過了 10 分鐘的妖魔圍攻。` : `${G.job.id}在${G.map[1]}倒下，再接再厲！`;
  const m = Math.floor(G.t / 60), s = Math.floor(G.t % 60);
  $('overStats').innerHTML = `<div><b>${m}:${String(s).padStart(2, '0')}</b>存活時間</div><div><b>${G.kills}</b>擊倒</div><div><b>${G.p.lv}</b>等級</div>`;
  try{ const k = 'szo-survivor-best', best = JSON.parse(localStorage.getItem(k) || '{}'), id = G.job.id + '|' + G.map[1]; if(!best[id] || G.t > best[id]){ best[id] = G.t; localStorage.setItem(k, JSON.stringify(best)); } }catch(e){}
  $('over').classList.add('on');
}
$('pauseBtn').onclick = pause; $('resumeBtn').onclick = resume;
$('quitBtn').onclick = () => { $('paused').classList.remove('on'); music(false); G = null; $('hud').hidden = true; $('bossBar').style.display = 'none'; $('title').classList.add('on'); };
$('againBtn').onclick = newGame;
$('titleBtn').onclick = () => { $('over').classList.remove('on'); music(false); G = null; $('title').classList.add('on'); };
document.addEventListener('visibilitychange', () => { if(document.hidden){ pause(); music(false); } else if(G && G.state !== 'over') music(true); });

// ---------- title ----------
function buildTitle(){
  const jp = $('jobPick'); jp.replaceChildren();
  JOBS.forEach((j, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', i === jobSel); b.innerHTML = `<canvas data-ch="${CHAR_DIR[j.id][sexSel]}" width="70" height="90"></canvas><b>${j.id}</b><small>${j.desc}</small><small>起始：${j.start}</small><small class="piliN">霹靂聯動技能 ${Object.values(PILI).filter(v => v.cl.includes(j.id)).length} 種</small>`; b.onclick = () => { jobSel = i; buildTitle(); }; jp.appendChild(b); });
  const sp = $('sexPick'); sp.replaceChildren();
  ['男', '女'].forEach((t, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', i === sexSel); b.innerHTML = `<canvas data-ch="${CHAR_DIR[JOBS[jobSel].id][i]}" width="70" height="90"></canvas><b>${t}${JOBS[jobSel].id}</b>`; b.onclick = () => { sexSel = i; buildTitle(); }; sp.appendChild(b); });
  // 用角色圖集裡「面向正面的待機圖」當預覽
  document.querySelectorAll('canvas[data-ch]').forEach(c => { const f = c.dataset.ch, im = img(SV + 'char_' + f + '.webp'), paint = () => { if(!CHAR) return; const r = CHAR[f].r[CHAR[f].a.wait[6][0]], g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.clearRect(0, 0, 70, 90); g.drawImage(im, r[0], r[1], r[2], r[3], Math.round(35 - r[2] / 2), 88 - r[3], r[2], r[3]); }; if(ready(im) && CHAR) paint(); else { im.addEventListener('load', paint); loaded.then(() => ready(im) && paint()); } });
  const mp = $('mapPick'); mp.replaceChildren();
  let best = {}; try{ best = JSON.parse(localStorage.getItem('szo-survivor-best') || '{}'); }catch(e){}
  D.maps.forEach((m, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-pressed', i === mapSel); const rec = best[JOBS[jobSel].id + '|' + m[1]]; b.innerHTML = `<b>${m[1]}</b><small>難度：${m[2]}</small><small>${rec ? '最佳：' + Math.floor(rec / 60) + ' 分 ' + Math.floor(rec % 60) + ' 秒' : '尚未挑戰'}</small>`; b.onclick = () => { mapSel = i; buildTitle(); }; mp.appendChild(b); });
}
buildTitle();
$('startBtn').disabled = true; $('startBtn').textContent = '素材載入中…';
loaded.then(() => { $('startBtn').disabled = false; $('startBtn').textContent = '出戰'; buildTitle(); }, () => { $('startBtn').textContent = '素材載入失敗，請重新整理'; });
$('startBtn').onclick = () => { if(CHAR) newGame(); };
const paintMute = () => { $('muteBtn').textContent = muted ? '🔇' : '🔊'; $('muteBtn').setAttribute('aria-label', muted ? '開啟音效' : '靜音'); };
$('muteBtn').onclick = () => { muted = !muted; try{ localStorage.setItem('szo-survivor-mute', muted ? '1' : '0'); }catch(e){} paintMute(); music(G && G.state === 'play'); };
paintMute();
// preload icons
Object.values(W).forEach(w => img(ICON(w.ic))); Object.values(P).forEach(v => img(ICON(v.ic)));
D.maps.forEach(m => img(SV + 'map/' + m[0] + '/mini.webp'));
</script>
